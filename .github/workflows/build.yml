name: Build C Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile C program
      run: |
        gcc main.c -o my_program

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-binary
        path: my_program
